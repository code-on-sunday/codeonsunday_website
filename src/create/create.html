<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>thiiss.me — make yours</title>
<link rel="stylesheet" href="./style.css" />
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <main class="page sparkles">
    <h1 class="grad title">this is me</h1>
    <p class="hint">drop <strong>3 to 6</strong> photos of you</p>
    <label class="dropzone" id="dropzone">
      <input type="file" id="file-input" accept="image/*" multiple hidden />
      <span class="dropzone__cta">tap or drop here</span>
    </label>
    <ul class="strip" id="strip"></ul>
    <div
      class="cf-turnstile"
      id="turnstile"
      data-sitekey="0x4AAAAAADM95inWGjTAgH-f"
      data-callback="onTurnstileSuccess"
      data-error-callback="onTurnstileError"
      data-expired-callback="onTurnstileExpired"
    ></div>
    <button class="weave" id="weave" disabled>weave my page</button>
  </main>
  <div class="overlay" id="overlay" hidden>
    <div class="spinner"></div>
    <p class="overlay__text" id="overlay-text">uploading photos…</p>
  </div>
  <p class="error" id="error" hidden></p>
  <script type="module" src="./main.js"></script>
</body>
</html>
